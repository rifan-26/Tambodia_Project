<!DOCTYPE html>
<html>
<head>
    <title>Test Filter Functionality</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Test Filter Functionality</h1>
    <button id="testAll">Test All Media</button>
    <button id="testImage">Test Image Filter</button>
    <button id="testVideo">Test Video Filter</button>
    <button id="testAudio">Test Audio Filter</button>
    
    <div id="results"></div>

    <script>
        const CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]') ? 
            document.querySelector('meta[name="csrf-token"]').getAttribute('content') : 
            '';

        function testFilter(type) {
            const url = type === 'all' ? 
                '/api/media/filter' : 
                `/api/media/filter?type=${type}`;
            
            fetch(url, {
                headers: {
                    'X-CSRF-TOKEN': CSRF_TOKEN,
                    'X-Requested-With': 'XMLHttpRequest',
                    'Accept': 'application/json',
                },
                credentials: 'same-origin',
            })
            .then(response => response.json())
            .then(data => {
                $('#results').html(`<pre>${JSON.stringify(data, null, 2)}</pre>`);
            })
            .catch(error => {
                $('#results').html(`<p style="color: red;">Error: ${error.message}</p>`);
            });
        }

        $('#testAll').click(() => testFilter('all'));
        $('#testImage').click(() => testFilter('image'));
        $('#testVideo').click(() => testFilter('video'));
        $('#testAudio').click(() => testFilter('audio'));
    </script>
</body>
</html>
